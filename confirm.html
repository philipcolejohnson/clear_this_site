<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      width: 400px;
      max-height: 600px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #303942;
      margin: 0;
      overflow-y: auto;
    }

    .logo {
      height: 1.5rem;
      margin-right: 0.5rem;
    }

    .header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e1e4e8;
    }

    h2 {
      margin: 0;
      font-size: 16px;
    }

    .site-name {
      font-weight: bold;
      color: #d73a49;
      word-break: break-word;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .options-section {
      margin-bottom: 16px;
    }

    .section-title {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 8px;
      color: #24292e;
    }

    .option {
      margin: 6px 0;
      font-size: 13px;
    }

    .option input[type="checkbox"] {
      margin-right: 6px;
    }

    .option label {
      cursor: pointer;
    }

    .cache-section,
    .storage-section,
    .application-section {
      margin-left: 8px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e1e4e8;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    .cancel-btn {
      background-color: #e1e4e8;
      color: #24292e;
    }

    .cancel-btn:hover {
      background-color: #d1d5da;
    }

    .confirm-btn {
      background-color: #d73a49;
      color: white;
    }

    .confirm-btn:hover {
      background-color: #cb2431;
    }

    .note {
      font-size: 11px;
      color: #666;
      font-style: italic;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>
  <div class="header">
    <img class="logo" alt="Clear This Site! logo" src="/images/inactive-128.png">
    <h2>Clear This Site?</h2>
  </div>
  
  <div class="site-name" id="site-name"></div>
  
  <div class="note">These settings apply to this action only</div>

  <form id="options-form">
    <div class="options-section application-section">
      <div class="section-title">Application</div>
      <div class="option">
        <input type="checkbox" id="serviceWorkers" name="serviceWorkers">
        <label for="serviceWorkers">Service workers</label>
      </div>
    </div>

    <div class="options-section storage-section">
      <div class="section-title">Storage</div>
      <div class="option">
        <input type="checkbox" id="localStorage" name="localStorage">
        <label for="localStorage">Local and session storage</label>
      </div>
      <div class="option">
        <input type="checkbox" id="indexedDB" name="indexedDB">
        <label for="indexedDB">IndexedDB</label>
      </div>
      <div class="option">
        <input type="checkbox" id="webSQL" name="webSQL">
        <label for="webSQL">Web SQL</label>
      </div>
      <div class="option">
        <input type="checkbox" id="cookies" name="cookies">
        <label for="cookies">Cookies</label>
      </div>
      <div class="option">
        <input type="checkbox" id="fileSystems" name="fileSystems">
        <label for="fileSystems">File systems</label>
      </div>
    </div>

    <div class="options-section cache-section">
      <div class="section-title">Cache</div>
      <div class="option">
        <input type="checkbox" id="cacheStorage" name="cacheStorage">
        <label for="cacheStorage">Cache storage</label>
      </div>
      <div class="option">
        <input type="checkbox" id="browserCache" name="browserCache">
        <label for="browserCache">Browser cache for this site</label>
      </div>
      <div class="option">
        <input type="checkbox" id="emptyAllCache" name="emptyAllCache">
        <label for="emptyAllCache">Empty full browser cache for all sites</label>
      </div>
    </div>
  </form>

  <div class="buttons">
    <button class="cancel-btn" id="cancel-btn">Cancel</button>
    <button class="confirm-btn" id="confirm-btn">Clear Data</button>
  </div>

  <script src="confirm.js"></script>
</body>

</html>
